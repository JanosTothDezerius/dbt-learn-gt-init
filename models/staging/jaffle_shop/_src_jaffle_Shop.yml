sources:
  - name: jaffle_shop
    description: A clone of dbt sample data
    database: dw_jaffle-shop
    schema: raw
    tables:
      - name: customers
        description: Raw customers data
        columns:
          - name: ID
            description: The primary key
            data_tests:
              - unique
              - not_null
              - dbt_utils.cardinality_equality:
                  arguments:
                    field: customer_id
                    to: ref('stg_jaffle_shop_customers')
      - name: orders